<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>密码本 · 手写本子</title>
  <link rel="stylesheet" href="notebook.css" />
  <link rel="stylesheet" href="variants.css" />
</head>
<body>
  <div class="desk" id="desk"></div>

  <!-- 书桌台面 + 书本 -->
  <div class="stage" id="stage">
    <div class="mat" id="mat"></div>
    <div class="book-wrap" id="bookWrap">
      <div class="book-shadow"></div>
      <!-- 翻页引擎（turn.js）的容器：页面由 notebook.js 在这里生成 -->
      <div class="book" id="book"></div>
      <div class="gutter" id="gutter"></div>
      <div class="ribbon" id="ribbon" title="翻到目录"><span>目<br>录</span></div>
    </div>
  </div>

  <!-- 底部控制条：左边"看"（翻页 + 目录 / 密码 / 音效），中间页码（这一页没有写/改按钮） -->
  <div class="toast" id="toast"></div>

  <script src="vendor/jquery.min.js"></script>
  <script src="vendor/turn.js"></script>
  <script type="module" src="notebook.js"></script>
</body>
</html>
